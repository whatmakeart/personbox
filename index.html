<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ultimate AI Vision Tracker</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>

    <style>
      :root {
        --bg: #111;
        --panel: #222;
        --panel-border: #444;
        --btn: #333;
        --btn-border: #555;
        --cyan: #00ffff;
        --pink: #ff69b4;
        --text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: monospace;
        min-height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        padding: 12px;
        padding-bottom: 24px;
        -webkit-tap-highlight-color: transparent;
      }

      h1 {
        margin: 8px 0 10px;
        font-size: clamp(18px, 3vw, 28px);
        text-align: center;
        letter-spacing: 0.04em;
      }

      #ui-container {
        width: min(100%, 960px);
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        align-items: center;
      }

      button,
      select {
        padding: 10px 12px;
        font-size: 13px;
        font-family: monospace;
        font-weight: bold;
        background: var(--btn);
        color: var(--text);
        border: 2px solid var(--btn-border);
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        transition:
          transform 0.12s ease,
          background-color 0.2s ease,
          border-color 0.2s ease;
        min-height: 42px;
      }

      button:hover,
      select:hover {
        transform: translateY(-1px);
      }

      button.active {
        background: var(--cyan);
        color: #111;
        border-color: var(--cyan);
      }

      .action-btn {
        background: var(--pink);
        border-color: var(--pink);
        color: #111;
      }

      .control-panel {
        display: none;
        width: min(100%, 760px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 14px;
        margin-top: 12px;
      }

      .setting-row {
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .setting-row:last-child {
        margin-bottom: 0;
      }

      .checkbox-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--cyan);
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
      }

      #status {
        margin-top: 12px;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--cyan);
        text-align: center;
        width: min(100%, 760px);
        line-height: 1.45;
      }

      canvas {
        margin-top: 12px;
        display: block;
        max-width: 100%;
        height: auto !important;
        border: 2px solid #333;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        touch-action: none;
      }

      .help {
        margin-top: 8px;
        font-size: 12px;
        color: #aaa;
        text-align: center;
        width: min(100%, 760px);
        line-height: 1.4;
      }

      @media (max-width: 700px) {
        body {
          padding: 10px;
        }

        #ui-container {
          gap: 6px;
        }

        button,
        select {
          font-size: 12px;
          padding: 10px 10px;
        }

        .control-panel {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Ultimate AI Vision Tracker</h1>

    <div id="ui-container">
      <button class="action-btn" id="camBtn" type="button">Swap Camera</button>
      <button class="action-btn" id="fsBtn" type="button">Full Screen</button>

      <button class="modeBtn active" data-mode="mocap" type="button">Neon Mocap</button>
      <button class="modeBtn" data-mode="hud" type="button">Data HUD</button>
      <button class="modeBtn" data-mode="box" type="button">Bounding Box</button>
      <button class="modeBtn" data-mode="seg" type="button">Segmentation Lab</button>
      <button class="modeBtn" data-mode="depthmap" type="button">Depth Mask</button>
      <button class="modeBtn" data-mode="pointcloud" type="button">Point Cloud</button>
      <button class="modeBtn" data-mode="mesh" type="button">3D Mesh</button>
    </div>

    <div id="seg-settings" class="control-panel">
      <div class="setting-row">
        <span>AI Model:</span>
        <select id="segModelSelect">
          <option value="bodypix">BodyPix (Parts + Slower)</option>
          <option value="selfie">Selfie (Silhouette + Faster)</option>
        </select>
      </div>

      <div class="setting-row">
        <span>Render Style:</span>
        <select id="renderStyle">
          <option value="both">Separation + Body Color</option>
          <option value="bg">Background Separation Only</option>
          <option value="color">Body Coloring Only</option>
        </select>
      </div>

      <div id="bp-controls">
        <div class="setting-row">
          <label>
            <input type="checkbox" id="showLabels" checked />
            Show Part Labels
          </label>
        </div>

        <div class="setting-row">
          <span>Track Parts:</span>
          <div class="checkbox-group">
            <label>
              <input type="checkbox" class="part-toggle" value="face" checked />
              Face
            </label>
            <label>
              <input type="checkbox" class="part-toggle" value="torso" checked />
              Torso
            </label>
            <label>
              <input type="checkbox" class="part-toggle" value="arms" checked />
              Arms
            </label>
            <label>
              <input type="checkbox" class="part-toggle" value="legs" checked />
              Legs
            </label>
          </div>
        </div>
      </div>
    </div>

    <div id="mesh-settings" class="control-panel">
      <div class="setting-row">
        <label>
          <input type="checkbox" id="textureToggle" checked />
          Apply Video Texture to Mesh
        </label>
      </div>
    </div>

    <div id="status">Booting AI models. Allow camera access when prompted.</div>
    <div class="help">Point Cloud / Mesh: drag to orbit, scroll to zoom.</div>

    <script src="sketch.js"></script>
  </body>
</html>
